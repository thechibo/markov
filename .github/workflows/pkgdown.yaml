# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-tinytex@v2
        timeout-minutes: 10

      # The website also builds the Sweave PDF vignette.
      - name: Install JSS vignette LaTeX dependencies
        timeout-minutes: 10
        shell: bash
        env:
          # Avoid the aria2c background download that stalled on Windows.
          TEXLIVE_DOWNLOADER: curl
          TEXLIVE_PREFETCH: '0'
        run: |
          tlmgr update --self
          tlmgr install latex graphics xcolor fancyvrb natbib hyperref upquote lm grfext

      - name: Verify JSS vignette LaTeX dependencies
        timeout-minutes: 2
        shell: bash
        run: |
          pdflatex --version
          for style in graphicx.sty xcolor.sty fancyvrb.sty natbib.sty hyperref.sty upquote.sty lmodern.sty grfext.sty; do
            kpsewhich "$style"
          done

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
