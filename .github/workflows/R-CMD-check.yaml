# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    timeout-minutes: 60
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}
          - {os: ubuntu-latest,  r: 'oldrel-4'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-tinytex@v2
        timeout-minutes: 10
        env:
          # The larger Windows bundle includes ae, grfext, and upquote;
          # avoid the tlmgr package installation that hangs on this runner.
          TINYTEX_INSTALLER: ${{ runner.os == 'Windows' && 'TinyTeX' || 'TinyTeX-1' }}

      # Sweave does not automatically install missing LaTeX packages.
      # Windows gets these packages from the prebuilt bundle above.
      - name: Update TeX Live package manager
        if: runner.os != 'Windows'
        timeout-minutes: 5
        env:
          TEXLIVE_DOWNLOADER: curl
          TEXLIVE_PREFETCH: '0'
        run: tlmgr update --self

      - name: Install JSS vignette LaTeX dependencies
        if: runner.os != 'Windows'
        timeout-minutes: 10
        env:
          # Keep package downloads sequential.
          TEXLIVE_DOWNLOADER: curl
          TEXLIVE_PREFETCH: '0'
        # Older R versions ship a JSS class that also requires ae.
        run: tlmgr install latex graphics xcolor fancyvrb natbib hyperref upquote lm grfext ae

      - name: Verify JSS vignette LaTeX dependencies
        timeout-minutes: 2
        shell: bash
        run: |
          pdflatex --version
          for style in graphicx.sty xcolor.sty fancyvrb.sty natbib.sty hyperref.sty upquote.sty lmodern.sty grfext.sty ae.sty; do
            kpsewhich "$style"
          done

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        timeout-minutes: 30
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
